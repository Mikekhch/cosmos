<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_16 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_16" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_16');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js 3D animated holographic user avatar node
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 280;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
camera.position.set(0, 0.4, 4.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x00f0ff, 1.2);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0x00f0ff, 3.5, 50);
pointLight1.position.set(2, 3, 3);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xa855f7, 3.0, 50);
pointLight2.position.set(-2, -2, 2);
scene.add(pointLight2);

// Avatar Group
const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

// Cybernetic Head Silhouette
const headGeo = new THREE.SphereGeometry(0.85, 32, 32);
const headMat = new THREE.MeshPhongMaterial({
  color: 0x0a192f,
  emissive: 0x052e42,
  wireframe: true,
  transparent: true,
  opacity: 0.65
});
const headMesh = new THREE.Mesh(headGeo, headMat);
avatarGroup.add(headMesh);

// Core Holographic Neural Orb inside head
const innerCoreGeo = new THREE.IcosahedronGeometry(0.45, 2);
const innerCoreMat = new THREE.MeshPhongMaterial({
  color: 0x00f0ff,
  emissive: 0x00d2ff,
  shininess: 90,
  wireframe: false,
  transparent: true,
  opacity: 0.85
});
const innerCore = new THREE.Mesh(innerCoreGeo, innerCoreMat);
avatarGroup.add(innerCore);

// Cybernetic Torso / Collar Stand
const neckGeo = new THREE.CylinderGeometry(0.25, 0.45, 0.6, 16);
const neckMat = new THREE.MeshPhongMaterial({
  color: 0x111d2e,
  wireframe: true,
  transparent: true,
  opacity: 0.45
});
const neckMesh = new THREE.Mesh(neckGeo, neckMat);
neckMesh.position.y = -1.0;
avatarGroup.add(neckMesh);

const shoulderGeo = new THREE.TorusGeometry(1.2, 0.08, 12, 48, Math.PI);
const shoulderMat = new THREE.MeshPhongMaterial({
  color: 0xa855f7,
  wireframe: true,
  transparent: true,
  opacity: 0.6
});
const shoulderMesh = new THREE.Mesh(shoulderGeo, shoulderMat);
shoulderMesh.rotation.z = Math.PI;
shoulderMesh.position.y = -0.9;
avatarGroup.add(shoulderMesh);

// Holographic Orbiting Data Rings
const ringGeo1 = new THREE.TorusGeometry(1.4, 0.02, 16, 80);
const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.75 });
const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
ring1.rotation.x = Math.PI * 0.35;
avatarGroup.add(ring1);

const ringGeo2 = new THREE.TorusGeometry(1.65, 0.015, 16, 80);
const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.6 });
const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
ring2.rotation.y = Math.PI * 0.4;
avatarGroup.add(ring2);

// Surrounding floating quantum particles
const particleCount = 140;
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount * 3; i += 3) {
  particlePos[i] = (Math.random() - 0.5) * 4.5;
  particlePos[i + 1] = (Math.random() - 0.5) * 4.0;
  particlePos[i + 2] = (Math.random() - 0.5) * 3.0;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
const particleMat = new THREE.PointsMaterial({
  size: 0.045,
  color: 0x00f0ff,
  transparent: true,
  opacity: 0.8
});
const particles = new THREE.Points(particleGeo, particleMat);
avatarGroup.add(particles);

// Interactive mouse rotation
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  const rect = container.getBoundingClientRect();
  const relX = e.clientX - rect.left - rect.width / 2;
  const relY = e.clientY - rect.top - rect.height / 2;
  mouseX = (relX / rect.width) * 0.8;
  mouseY = (relY / rect.height) * 0.8;
});

let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  avatarGroup.rotation.y = elapsedTime * 0.35 + targetX;
  avatarGroup.rotation.x = Math.sin(elapsedTime * 0.5) * 0.08 + targetY;
  avatarGroup.position.y = Math.sin(elapsedTime * 1.4) * 0.08;

  innerCore.rotation.x += 0.02;
  innerCore.rotation.y += 0.03;
  const pulse = 1 + Math.sin(elapsedTime * 3) * 0.08;
  innerCore.scale.set(pulse, pulse, pulse);

  ring1.rotation.z += 0.015;
  ring2.rotation.x += 0.012;
  particles.rotation.y -= 0.005;

  renderer.render(scene, camera);
}

animate();

const handleResize = () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 280;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', handleResize);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_16 -->
</body>
</html>
